---
deployment:
  tasks:
    - export PUBLICPATH=/home/sungreen/public_html
    - export DEPLOYPATH=/home/sungreen/web_folder/sungreen
    - export COMPOSER_PATH=~/bin/composer/composer.phar
    - export PHP_PATH=/usr/local/bin/php
    - /bin/cp -R * $DEPLOYPATH
    - $PHP_PATH $COMPOSER_PATH update --working-dir=$DEPLOYPATH --no-dev
    - /bin/cp -rf public/vendor/* $DEPLOYPATH/public/vendor
    - /bin/cp -rf public/vendor/* $PUBLICPATH/vendor
    - /bin/rm -rf $DEPLOYPATH/.git
    - /bin/rm -rf $DEPLOYPATH/.deploy.json
    - /bin/rm -rf $DEPLOYPATH/.editorconfig
    - /bin/rm -rf $DEPLOYPATH/.cpanel.yml
    - /bin/rm -rf $DEPLOYPATH/.gitignore
    - /bin/rm -rf $DEPLOYPATH/.npmrc
    - /bin/rm -rf $DEPLOYPATH/boost.json
    - /bin/rm -rf $DEPLOYPATH/README.md
    - /bin/cp -rf $DEPLOYPATH/public/css $PUBLICPATH/css
    - /bin/cp -rf $DEPLOYPATH/public/js $PUBLICPATH/js
    - /bin/cp -rf $DEPLOYPATH/public/sitemap.xml $PUBLICPATH/sitemap.xml
    - /bin/cp -rf $DEPLOYPATH/public/img $PUBLICPATH/img
    - /bin/cp -rf $DEPLOYPATH/public/fonts $PUBLICPATH/fonts
    - /bin/cp -rf $DEPLOYPATH/public/favicon.ico $PUBLICPATH/favicon.ico
    - /bin/cp -rf $DEPLOYPATH/public/robots.txt $PUBLICPATH/robots.txt
